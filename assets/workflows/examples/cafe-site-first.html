<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=5d1f56fb-2fec-48b7-bc44-becf4ba8db5a
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="街角咖啡练习网站：饮品菜单、营业时间和地址。">
  <title>街角咖啡</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202923; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid #24614d; outline-offset: 5px; }
    header, main, footer { width: min(100% - 48px, 1024px); margin-inline: auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding-block: 26px; border-bottom: 1px solid #d9e3dd; }
    .name { font-size: 20px; font-weight: 650; }
    nav { display: flex; gap: 24px; font-size: 14px; }
    .intro { padding: 64px 0 56px; border-bottom: 1px solid #d9e3dd; }
    h1 { margin: 0 0 18px; font-size: 52px; font-weight: 650; line-height: 1.15; }
    .intro p { margin: 0; color: #5d6a62; font-size: 18px; line-height: 1.8; }
    .menu { padding: 40px 0 56px; }
    h2 { margin: 0 0 28px; font-size: 24px; font-weight: 600; line-height: 1.4; }
    .menu-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px; margin: 0; padding: 0; list-style: none; }
    .drink { padding: 20px 0; border-top: 2px solid #24614d; }
    .drink h3 { margin: 0; font-size: 22px; font-weight: 600; }
    .drink p { min-height: 52px; margin: 12px 0 20px; color: #5d6a62; font-size: 14px; line-height: 1.8; }
    .price { color: #24614d; font-size: 24px; font-weight: 600; }
    .visit { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 36px 0; border-top: 1px solid #d9e3dd; }
    .visit h2 { margin-bottom: 12px; font-size: 18px; }
    .visit p { margin: 0; font-size: 16px; line-height: 1.8; }
    footer { padding: 24px 0; border-top: 1px solid #d9e3dd; color: #5d6a62; font-size: 13px; }
    @media (max-width: 600px) {
      header, main, footer { width: calc(100% - 40px); }
      header { gap: 12px; padding-block: 22px; }
      nav { gap: 16px; font-size: 13px; }
      .name { font-size: 18px; }
      .intro { padding: 42px 0; }
      h1 { font-size: 36px; }
      .intro p { font-size: 16px; }
      .menu { padding: 30px 0; }
      .menu-list { grid-template-columns: 1fr; gap: 12px; }
      .drink p { min-height: 0; margin-bottom: 14px; }
      .visit { grid-template-columns: 1fr; gap: 28px; padding-block: 30px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="name" href="#top">街角咖啡</a>
    <nav aria-label="页面导航">
      <a href="#menu">饮品菜单</a>
      <a href="#visit">到店信息</a>
    </nav>
  </header>
  <main id="top">
    <section class="intro" aria-labelledby="site-title">
      <h1 id="site-title">街角咖啡</h1>
      <p>下班路上，坐下来喝杯咖啡。</p>
    </section>
    <section class="menu" id="menu" aria-labelledby="menu-title">
      <h2 id="menu-title">饮品菜单</h2>
      <ul class="menu-list">
        <li class="drink"><h3>美式</h3><p>浓缩咖啡与水，风味清爽。</p><span class="price">18 元</span></li>
        <li class="drink"><h3>拿铁</h3><p>浓缩咖啡与牛奶，口感柔和。</p><span class="price">24 元</span></li>
        <li class="drink"><h3>燕麦拿铁</h3><p>浓缩咖啡与燕麦饮，谷物香气。</p><span class="price">28 元</span></li>
      </ul>
    </section>
    <section class="visit" id="visit" aria-label="到店信息">
      <div><h2>营业时间</h2><p>周一至周日 09:00–20:00</p></div>
      <div><h2>地址</h2><p>示例路 18 号</p></div>
    </section>
  </main>
  <footer>街角咖啡 · 练习店铺</footer>
</body>
</html>
